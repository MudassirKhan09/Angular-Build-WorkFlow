name: Build My Angular App

on:
  push:
    branches: [ main ]

jobs:
  build-angular-apps:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup Node JS
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - name: Install Dependencies
        run: npm ci
      - name: Build Angular App
        run: npm run build
